<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}body>header.nav,body>footer.ft{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif}a{color:inherit}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.top .in{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top b{font-size:1.05rem}.top small{color:var(--mut);display:block}
.tabs{max-width:1100px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}.tabs button{flex:none;padding:12px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);font:600 .92rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}.tabs button.on{color:var(--fg);border-color:var(--ac)}.tabs .n{background:var(--ac);color:var(--on);border-radius:99px;padding:1px 7px;font-size:.72rem;margin-left:4px}
main{max-width:1100px;margin:auto;padding:16px}h2{margin:0 0 12px;font-size:1.25rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.mut{color:var(--mut)}.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--line)}.pill.new{background:#ffe9b8;color:#6b4a00}.pill.ok{background:#d7f3e3;color:#14633a}.pill.bad{background:#fbdcd8;color:#8a1f13}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}label{display:block;font-size:.82rem;font-weight:700;margin:12px 0 4px}

.bars{display:flex;align-items:flex-end;gap:5px;height:90px}.bars i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}.empty{text-align:center;padding:36px 10px;color:var(--mut)}
.warn{background:#fff3d6;color:#6b4a00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2a2e;color:#fff;padding:10px 18px;border-radius:99px;z-index:99}
@media(max-width:600px){.g2{grid-template-columns:1fr}.it{grid-template-columns:48px 1fr}.it .acts{grid-column:1/-1}.kv{grid-template-columns:100px 1fr}}
</style></head><body>
<div class="top"><div class="in"><div><b id="sn">Manage</b><small id="sd"></small></div><div><a class="btn o sm" href="dashboard.html">My Sites</a> <a class="btn sm" id="view" target="_blank" rel="noopener">View site</a></div></div><div class="tabs" id="tabs"></div></div>
<main id="m"><div class="empty">Loading...</div></main><div class="ov" id="ov"><div class="md" id="md"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="app.js"></script><script src="engine.js"></script><script src="packs.js"></script><script>
(()=>{const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON);let SITE,KIND,TAB,TABS,ITEMS=[],ORD=[],BK=[],FM=[],SET={},FILT={},lastNew=-1;
const AB=(x)=>x;const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)};
const ago=d=>{const s=(Date.now()-new Date(d))/1000;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short'})};
const wa=(p,t)=>{let n=String(p||'').replace(/\D/g,'');if(n[0]=='0')n='234'+n.slice(1);return 'https://wa.me/'+n+'?text='+encodeURIComponent(t||'')};
const tabsFor={restaurant:[['overview','Overview'],['orders','Orders'],['items','Menu'],['forms','Messages'],['settings','Settings']],store:[['overview','Overview'],['orders','Orders'],['items','Products'],['forms','Messages'],['settings','Settings']],school:[['overview','Overview'],['apps','Applications'],['forms','Messages'],['settings','Settings']],booking:[['overview','Overview'],['bookings','Bookings'],['items','Services'],['forms','Messages'],['settings','Settings']]};
async function boot(){const {data:{session}}=await sb.auth.getSession();
 if(!session){$('#m').innerHTML='<div class="card"><h2>Please log in</h2><p class="mut">Log in to manage your business.</p><a class="btn" href="login.html">Log in</a></div>';return}
 const {data:sites}=await sb.from('sites').select('id,data,variant,domain,live,category');const mine=(sites||[]).filter(s=>{const t=TPLS.find(x=>x.id===s.variant);return t&&t.sys});
 const id=new URLSearchParams(location.search).get('id');SITE=mine.find(s=>s.id==id)||(mine.length==1?mine[0]:null);
 if(!SITE){$('#m').innerHTML=mine.length?'<h2>Choose a site</h2>'+mine.map(s=>`<a class="card row" href="manage.html?id=${s.id}" style="text-decoration:none"><b>${esc(s.data&&s.data.name||s.domain)}</b><span class="mut">${esc(s.domain||'')}</span></a>`).join(''):'<div class="card"><h2>No business system yet</h2><p class="mut">Pick a Restaurant, Store, School or Booking template, save it, and it appears here.</p><a class="btn" href="templates.html">Choose a template</a></div>';return}
 KIND=TPLS.find(x=>x.id===SITE.variant).sys;TABS=tabsFor[KIND];TAB=new URLSearchParams(location.search).get('tab')||'overview';
 $('#sn').textContent=(SITE.data&&SITE.data.name)||'Manage';$('#sd').textContent=SITE.live?(SITE.domain||'Live'):'Not published yet: customers cannot see your menu or order until your site is live';$('#view').href=SITE.domain&&SITE.live?'https://'+SITE.domain:'site.html?id='+SITE.id;
 await loadAll();draw();setInterval(()=>{if(!document.hidden&&!$('#ov').classList.contains('on')&&['overview','orders','bookings','apps','forms'].includes(TAB))refresh()},30000)}
async function loadAll(){const q=(t,o)=>sb.from(t).select('*').eq('site_id',SITE.id).order(o,{ascending:false}).limit(500);
 const [i,o,b,f,s]=await Promise.all([sb.from('b_items').select('*').eq('site_id',SITE.id).order('category').order('sort').order('name').limit(1000),q('b_orders','created'),sb.from('b_bookings').select('*').eq('site_id',SITE.id).order('day',{ascending:false}).order('slot',{ascending:false}).limit(500),q('b_forms','created'),sb.from('b_settings').select('s').eq('site_id',SITE.id).maybeSingle()]);
 const err=[i,o,b,f].find(x=>x.error);if(err){$('#m').innerHTML='<div class="card"><h2>Database not ready</h2><p class="mut">'+esc(err.error.message)+'</p><p>Run <b>supabase-systems.sql</b> in your Supabase SQL Editor, then refresh.</p></div>';throw 0}
 ITEMS=i.data||[];ORD=o.data||[];BK=b.data||[];FM=f.data||[];SET=(s.data&&s.data.s)||{}}
async function refresh(){const n=ORD.filter(x=>x.status=='new').length;await loadAll();const n2=ORD.filter(x=>x.status=='new').length;if(lastNew>=0&&n2>n)beep();draw()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),250)}catch{};toast('New order received')}
const cnt=k=>({orders:ORD.filter(x=>x.status=='new').length,bookings:BK.filter(x=>x.status=='pending').length,apps:FM.filter(x=>x.kind=='admission'&&x.status=='new').length,forms:FM.filter(x=>x.kind=='enquiry'&&x.status=='new').length}[k]||0);
function draw(){lastNew=ORD.filter(x=>x.status=='new').length;$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k==TAB?'on':''}">${l}${cnt(k)?`<span class="n">${cnt(k)}</span>`:''}</button>`).join('');$('#m').innerHTML='';({overview,orders,items,bookings,apps:()=>forms('admission'),forms:()=>forms('enquiry'),settings})[TAB]()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){TAB=b.dataset.t;FILT={};history.replaceState(0,'','?id='+SITE.id+'&tab='+TAB);draw()}};
const put=h=>$('#m').insertAdjacentHTML('beforeend',h);
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}$('#ov').onclick=e=>{if(e.target.id=='ov')$('#ov').classList.remove('on')};const closeM=()=>$('#ov').classList.remove('on');
function csv(name,rows){const c=rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+c],{type:'text/csv'}));a.download=name+'.csv';a.click()}
async function run(p,ok){const r=await p;if(r.error){toast('Error: '+r.error.message);return false}if(ok)toast(ok);return true}

/* ---------- overview ---------- */
function overview(){const today=new Date().toISOString().slice(0,10),paid=ORD.filter(o=>o.pay_status=='paid'&&o.status!='cancelled'),d30=Date.now()-30*864e5,r30=paid.filter(o=>+new Date(o.created)>d30).reduce((a,o)=>a+ +o.total,0),all=paid.reduce((a,o)=>a+ +o.total,0);
 const low=ITEMS.filter(i=>i.kind=='product'&&i.stock!=null&&i.stock<=3),nop=ITEMS.filter(i=>i.kind=='product'&&i.price==null);
 const stats=KIND=='school'?[[cnt('apps'),'New applications'],[FM.filter(x=>x.kind=='admission').length,'All applications'],[cnt('forms'),'New messages']]:KIND=='booking'?[[cnt('bookings'),'Waiting for confirmation'],[BK.filter(b=>b.day==today&&b.status!='cancelled').length,'Bookings today'],[BK.filter(b=>b.day>=today&&['pending','confirmed'].includes(b.status)).length,'Upcoming'],[cnt('forms'),'New messages']]:[[cnt('orders'),'New orders'],[ORD.filter(o=>o.created.slice(0,10)==today).length,'Orders today'],[money(r30),'Paid, last 30 days'],[money(all),'Paid, all time']];
 put('<h2>Today at a glance</h2><div class="stats">'+stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')+'</div>');
 if(!SITE.live)put('<div class="warn">Your site is not live yet, so customers cannot see your items. You can add everything now so it is ready on launch day.</div>');
 if(['restaurant','store','booking'].includes(KIND)&&!ITEMS.length)put(`<div class="card"><h2>Start here: add your ${KIND=='booking'?'services':KIND=='store'?'products':'menu'}</h2><p class="mut">Customers cannot order or book until you add items.</p><button class="btn" data-go="items">Add items</button> <button class="btn o" id="smp">Load sample items to edit</button></div>`);
 if(low.length)put('<div class="warn"><b>Running low:</b> '+low.map(i=>esc(i.name)+' ('+i.stock+')').join(', ')+'</div>');if(nop.length)put('<div class="warn">'+nop.length+' product(s) have no price, so customers cannot buy them online.</div>');
 if(KIND=='restaurant'||KIND=='store'){const days=[...Array(14)].map((_,k)=>{const d=new Date(Date.now()-(13-k)*864e5).toISOString().slice(0,10);return[d,ORD.filter(o=>o.created.slice(0,10)==d&&o.status!='cancelled').length]}),mx=Math.max(1,...days.map(d=>d[1]));put('<div class="card"><b>Orders, last 14 days</b><div class="bars" style="margin-top:10px">'+days.map(d=>`<i title="${d[0]}: ${d[1]}" style="height:${Math.max(4,d[1]/mx*100)}%"></i>`).join('')+'</div></div>')}
 const link=SITE.live&&SITE.domain?'https://'+SITE.domain:'';if(link)put(`<div class="card row"><div><b>Your website</b><br><span class="mut">${esc(link)}</span></div><a class="btn o sm" href="${wa('','Visit '+(SITE.data.name||'')+': '+link).replace('wa.me/?','wa.me/?')}" target="_blank">Share on WhatsApp</a></div>`)}
$('#m').onclick=async e=>{const g=e.target.closest('[data-go]');if(g){TAB=g.dataset.go;draw()}if(e.target.id=='smp')sample()};

/* ---------- orders ---------- */
const NEXT={new:['confirmed','Confirm'],confirmed:['preparing','Start preparing'],preparing:['ready','Mark ready'],ready:['done','Complete'],out:['done','Complete']};
function orders(){const f=FILT.s||'active',L=ORD.filter(o=>f=='all'||(f=='active'?!['done','cancelled'].includes(o.status):o.status==f));
 put('<div class="row"><h2>Orders</h2><button class="btn o sm" id="ex">Download list</button></div><div class="chips">'+[['active','Open'],['new','New'],['done','Completed'],['cancelled','Cancelled'],['all','All']].map(([k,l])=>`<button data-f="${k}" class="${k==f?'on':''}">${l}</button>`).join('')+'</div>'+(L.map(o=>`<div class="card"><div class="row"><b>${esc(o.ref)} · ${esc(o.name)}</b><span class="pill ${o.status=='new'?'new':o.status=='cancelled'?'bad':o.status=='done'?'ok':''}">${o.status}</span></div>
 <div class="mut">${ago(o.created)} · ${o.mode=='delivery'?'Delivery':o.mode=='dinein'?'Dine-in':'Pickup'} · ${esc(o.phone)}</div><ul class="lines">${o.items.map(i=>`<li>${i.qty} × ${esc(i.name)} <span class="mut">${money(i.price*i.qty)}</span></li>`).join('')}</ul>
 ${o.address?`<div>📍 ${esc(o.address)}</div>`:''}${o.note?`<div>📝 ${esc(o.note)}</div>`:''}<div class="row" style="margin-top:8px"><b>${money(o.total)}</b><span class="pill ${o.pay_status=='paid'?'ok':'new'}">${o.pay_status=='paid'?'Paid':'Payment pending'} · ${o.pay_method=='transfer'?'transfer':o.pay_method=='cash'?'cash':o.pay_method=='card'?'online (Paystack)':'WhatsApp'}</span></div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${NEXT[o.status]?`<button class="btn sm" data-o="${o.id}" data-st="${NEXT[o.status][0]}">${NEXT[o.status][1]}</button>`:''}${o.status=='ready'&&o.mode=='delivery'?`<button class="btn o sm" data-o="${o.id}" data-st="out">Out for delivery</button>`:''}${o.pay_status!='paid'&&o.status!='cancelled'?`<button class="btn o sm" data-paid="${o.id}">Mark paid</button>`:''}<a class="btn o sm" target="_blank" rel="noopener" href="${wa(o.phone,'Hello '+o.name+', about your order '+o.ref+' ('+money(o.total)+')')}">WhatsApp</a>${!['done','cancelled'].includes(o.status)?`<button class="btn d sm" data-cancel="${o.id}">Cancel</button>`:''}</div></div>`).join('')||'<div class="empty">No orders here yet.</div>'));
 $('#ex').onclick=()=>csv('orders',[['Ref','Date','Name','Phone','Mode','Address','Items','Total','Payment','Paid','Status']].concat(ORD.map(o=>[o.ref,o.created,o.name,o.phone,o.mode,o.address,o.items.map(i=>i.qty+'x '+i.name).join('; '),o.total,o.pay_method,o.pay_status,o.status])))}
const upd=async(t,id,patch,msg)=>{if(await run(sb.from(t).update(patch).eq('id',id),msg))await refresh()};
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.f){FILT.s=d.f;draw()}else if(d.o)upd('b_orders',d.o,{status:d.st},'Updated');else if(d.paid)upd('b_orders',d.paid,{pay_status:'paid'},'Marked as paid');

 else if(d.bk)upd('b_bookings',d.bk,{status:d.st},'Updated');else if(d.fm)upd('b_forms',d.fm,{status:d.st},'Updated')});

/* ---------- items (menu / products / services) ---------- */
function items(){const kind=KIND=='booking'?'service':'product',L=ITEMS.filter(i=>i.kind==kind),f=FILT.c||'All',cats=['All',...new Set(L.map(i=>i.category).filter(Boolean))],q=(FILT.q||'').toLowerCase(),V=L.filter(i=>(f=='All'||i.category==f)&&(!q||i.name.toLowerCase().includes(q)));
 const word=kind=='service'?'service':KIND=='store'?'product':'menu item';
 put(`<div class="row"><h2>${kind=='service'?'Services':KIND=='store'?'Products':'Menu'} <span class="mut">(${L.length})</span></h2><div><button class="btn sm" id="add">+ Add ${word}</button> <button class="btn o sm" id="bulk">Paste many</button> <button class="btn o sm" id="exi">Download</button></div></div><input id="q" placeholder="Search..." value="${esc(FILT.q||'')}" style="margin-bottom:10px">`+(cats.length>2?'<div class="chips">'+cats.map(c=>`<button data-c="${esc(c)}" class="${c==f?'on':''}">${esc(c)}</button>`).join('')+'</div>':''));
 put(V.map(i=>`<div class="card it"><div>${i.image?`<img src="${esc(i.image)}" alt="">`:`<div class="ph">${esc((i.name||'?')[0])}</div>`}</div><div><b>${esc(i.name)}</b> ${i.active?'':'<span class="pill bad">Hidden</span>'}<div class="mut">${esc(i.category)}${kind=='service'?' · '+i.minutes+' min':''}</div><div>${i.price==null?'<span class="pill new">No price</span>':money(i.price)}${i.stock!=null?` · Stock ${i.stock}${i.stock<=3?' ⚠️':''}`:''}</div></div><div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn o sm" data-e="${i.id}">Edit</button><button class="btn o sm" data-tg="${i.id}">${i.active?'Hide':'Show'}</button></div></div>`).join('')||`<div class="empty">Nothing here yet. Add your first ${word}, or paste a whole list from Excel.</div>`);
 $('#q').oninput=e=>{FILT.q=e.target.value;const p=e.target.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p)};$('#add').onclick=()=>edit();$('#bulk').onclick=bulk;
 $('#exi').onclick=()=>csv('items',[['Name','Category','Price','Stock','Description','Photo','Visible']].concat(L.map(i=>[i.name,i.category,i.price,i.stock,i.descr,i.image,i.active])))}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.c!=null&&TAB=='items'){FILT.c=t.dataset.c;draw()}if(t.dataset.e)edit(ITEMS.find(i=>i.id==t.dataset.e));if(t.dataset.tg){const i=ITEMS.find(x=>x.id==t.dataset.tg);upd('b_items',i.id,{active:!i.active},i.active?'Hidden from customers':'Visible to customers')}});
function edit(i){const kind=KIND=='booking'?'service':'product',n=!i;i=i||{kind,name:'',category:'',descr:'',price:'',stock:'',minutes:60,image:'',active:true};
 modal(`<h3 style="margin-top:0">${n?'Add':'Edit'} ${kind=='service'?'service':KIND=='store'?'product':'menu item'}</h3><form id="ef"><label>Name</label><input name="name" required maxlength="120" value="${esc(i.name)}"><div class="g2"><div><label>Category</label><input name="category" list="cl" maxlength="60" value="${esc(i.category)}" placeholder="e.g. Rice, Printers, Hair"><datalist id="cl">${[...new Set(ITEMS.map(x=>x.category).filter(Boolean))].map(c=>`<option>${esc(c)}`).join('')}</datalist></div><div><label>Price (₦) ${kind=='product'?'<span class="mut">leave empty = ask for price</span>':''}</label><input name="price" type="number" min="0" step="any" value="${i.price??''}"></div></div>
 ${kind=='product'?`<label>Stock <span class="mut">leave empty = not tracked</span></label><input name="stock" type="number" min="0" step="1" value="${i.stock??''}">`:`<label>Duration (minutes)</label><input name="minutes" type="number" min="5" max="600" value="${i.minutes}">`}
 <label>Description</label><textarea name="descr" rows="2" maxlength="600">${esc(i.descr)}</textarea><label>Photo</label>${i.image?`<img id="pv" src="${esc(i.image)}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px">`:'<img id="pv" style="display:none;width:90px;height:90px;object-fit:cover;border-radius:10px;margin-bottom:6px">'}<input type="file" id="pf" accept="image/*"><input type="hidden" name="image" value="${esc(i.image)}">
 <div id="ee"></div><div class="row" style="margin-top:16px"><div>${n?'':'<button type="button" class="btn d sm" id="del">Delete</button>'}</div><div><button type="button" class="btn o" id="cx">Cancel</button> <button class="btn">Save</button></div></div></form>`);
 $('#cx').onclick=closeM;if(!n)$('#del').onclick=async()=>{if(confirm('Delete "'+i.name+'" for good? Use Hide if you only want to take it off the site for now.')&&await run(sb.from('b_items').delete().eq('id',i.id),'Deleted')){closeM();await refresh()}};
 $('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#ee').innerHTML='<span class="mut">Uploading photo...</span>';try{const url=await upload(f);$('#ef').image.value=url;$('#pv').src=url;$('#pv').style.display='block';$('#ee').innerHTML=''}catch(x){$('#ee').innerHTML='<div class="warn">'+esc(x.message)+'</div>'}};
 $('#ef').onsubmit=async e=>{e.preventDefault();const f=e.target,row={site_id:SITE.id,kind,name:f.name.value.trim(),category:f.category.value.trim(),descr:f.descr.value.trim(),price:f.price.value===''?null:+f.price.value,image:f.image.value,active:i.active};if(kind=='product')row.stock=f.stock.value===''?null:Math.floor(+f.stock.value);else row.minutes=+f.minutes.value||60;
  const r=n?await sb.from('b_items').insert(row):await sb.from('b_items').update(row).eq('id',i.id);if(r.error){$('#ee').innerHTML='<div class="warn">'+esc(r.error.message)+'</div>';return}closeM();toast('Saved');await refresh()}}
function shrink(f,m,q){return new Promise((ok,no)=>{const im=new Image;im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Could not read this image')),'image/jpeg',q)};im.onerror=()=>no(new Error('Could not read this image'));im.src=URL.createObjectURL(f)})}
async function upload(f){const blob=await shrink(f,900,.78),path=SITE.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg',r=await sb.storage.from('biz').upload(path,blob,{contentType:'image/jpeg'});
 if(!r.error)return sb.storage.from('biz').getPublicUrl(path).data.publicUrl;const small=await shrink(f,360,.7);return await new Promise(ok=>{const fr=new FileReader;fr.onload=()=>ok(fr.result);fr.readAsDataURL(small)})}
function bulk(){const kind=KIND=='booking'?'service':'product';modal(`<h3 style="margin-top:0">Paste many at once</h3><p class="mut">Copy rows from Excel or Google Sheets and paste below. Columns in this order:<br><b>Name, Category, Price, ${kind=='service'?'Minutes':'Stock'}, Description, Photo link</b><br>Only Name is required. If a name already exists in the same category it is updated.</p><textarea id="bt" rows="8" placeholder="Jollof Rice&#9;Rice&#9;2500&#9;&#9;With chicken"></textarea><div id="be"></div><div class="row" style="margin-top:14px"><button class="btn o" id="cx">Cancel</button><button class="btn" id="go">Add them</button></div>`);$('#cx').onclick=closeM;
 $('#go').onclick=async()=>{const rows=$('#bt').value.split('\n').map(l=>l.split(l.includes('\t')?'\t':',').map(x=>x.trim())).filter(r=>r[0]);if(!rows.length)return;let a=0,u=0;const ins=[];
  for(const r of rows){const o={site_id:SITE.id,kind,name:r[0].slice(0,120),category:(r[1]||'').slice(0,60),price:r[2]===undefined||r[2]===''||isNaN(+r[2].replace(/[₦,]/g,''))?null:+r[2].replace(/[₦,]/g,''),descr:(r[4]||'').slice(0,600),image:/^https?:/.test(r[5]||'')?r[5]:''};if(kind=='product')o.stock=r[3]===undefined||r[3]===''||isNaN(+r[3])?null:Math.floor(+r[3]);else o.minutes=+r[3]||60;
   const ex=ITEMS.find(x=>x.kind==kind&&x.name.toLowerCase()==o.name.toLowerCase()&&x.category==o.category);if(ex){const p={...o};delete p.site_id;if(!p.image)delete p.image;if(await run(sb.from('b_items').update(p).eq('id',ex.id)))u++}else ins.push(o)}
  for(let k=0;k<ins.length;k+=100){const r=await sb.from('b_items').insert(ins.slice(k,k+100));if(r.error){$('#be').innerHTML='<div class="warn">'+esc(r.error.message)+'</div>';return}a+=Math.min(100,ins.length-k)}closeM();toast(a+' added, '+u+' updated');await refresh()}}
const SAMPLES={restaurant:[['Jollof Rice & Chicken','Rice',2500,'Smoky party jollof with grilled chicken.'],['Fried Rice & Plantain','Rice',2500,'Veggie fried rice with dodo.'],['Pounded Yam & Egusi','Swallow',3000,'Fresh egusi soup with assorted meat.'],['Suya Platter','Grills',2000,'Spicy beef suya with onions and yaji.'],['Pepper Soup','Soups',2200,'Hot goat meat pepper soup.'],['Chapman','Drinks',1200,'Chilled house chapman.']],store:[['Wireless Mouse','Accessories',6500,'Quiet 2.4GHz wireless mouse.'],['Laptop Bag 15.6"','Accessories',12000,'Water-resistant padded bag.'],['Router AC1200','Networking',28000,'Dual-band WiFi router.'],['Power Bank 20000mAh','Power',18500,'Fast charging, 2 ports.'],['Bluetooth Speaker','Audio',15000,'Loud, clear and portable.']],booking:[['Classic Haircut','Hair',3000,'Clean cut and styling.',45],['Braids (Medium)','Hair',15000,'Neat medium braids.',180],['Full Body Massage','Spa',20000,'60 minutes of deep relaxation.',60],['Manicure & Pedicure','Nails',12000,'Complete hand and foot care.',90]]};
async function sample(){const k=KIND=='booking'?'service':'product',PK=TPLS.find(x=>x.id===SITE.variant).pack,rows=((PK&&window.BIZ_PACKS&&BIZ_PACKS[PK])||SAMPLES[KIND]||[]).map((r,x)=>({site_id:SITE.id,kind:k,name:r[0],category:r[1],price:r[2],descr:r[3],sort:x,...(k=='service'?{minutes:r[4]}:{})}));if(await run(sb.from('b_items').insert(rows),PK?'Starter items added. Open each one to set the price, photo and stock.':'Sample items added. Edit them to match your business.')){TAB='items';await refresh()}}

/* ---------- bookings ---------- */
function bookings(){const today=new Date().toISOString().slice(0,10),f=FILT.s||'upcoming',L=BK.filter(b=>f=='all'||(f=='today'?b.day==today&&b.status!='cancelled':f=='upcoming'?b.day>=today&&['pending','confirmed'].includes(b.status):f=='pending'?b.status=='pending':b.day<today||['done','cancelled','no_show'].includes(b.status))).sort((a,b)=>f=='past'||f=='all'?(b.day+b.slot<a.day+a.slot?-1:1):(a.day+a.slot<b.day+b.slot?-1:1));
 put('<div class="row"><h2>Bookings</h2><button class="btn o sm" id="ex">Download list</button></div><div class="chips">'+[['upcoming','Upcoming'],['today','Today'],['pending','Waiting'],['past','Past'],['all','All']].map(([k,l])=>`<button data-f="${k}" class="${k==f?'on':''}">${l}</button>`).join('')+'</div>'+(L.map(b=>`<div class="card"><div class="row"><b>${new Date(b.day+'T00:00').toLocaleDateString('en-NG',{weekday:'short',day:'numeric',month:'short'})} · ${esc(b.slot)}</b><span class="pill ${b.status=='pending'?'new':b.status=='confirmed'||b.status=='done'?'ok':'bad'}">${b.status.replace('_',' ')}</span></div><div><b>${esc(b.name)}</b> · ${esc(b.phone)}</div><div class="mut">${esc(b.service||'Appointment')} · ref ${esc(b.ref)}</div>${+b.amount_due>0?`<div><span class="pill ${b.pay_status=='paid'?'ok':'new'}">${b.pay_status=='paid'?'Paid':'Payment pending'} · ${money(b.amount_due)}</span></div>`:''}${b.note?`<div>📝 ${esc(b.note)}</div>`:''}
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${b.status=='pending'?`<button class="btn sm" data-bk="${b.id}" data-st="confirmed">Confirm</button>`:''}${b.status=='confirmed'?`<button class="btn sm" data-bk="${b.id}" data-st="done">Done</button><button class="btn o sm" data-bk="${b.id}" data-st="no_show">No-show</button>`:''}<a class="btn o sm" target="_blank" rel="noopener" href="${wa(b.phone,'Hello '+b.name+', your booking at '+(SITE.data.name||'')+' is '+(b.status=='pending'?'received':'confirmed')+' for '+b.day+' at '+b.slot+'.')}">WhatsApp</a>${['pending','confirmed'].includes(b.status)?`<button class="btn d sm" data-bk="${b.id}" data-st="cancelled">Cancel</button>`:''}</div></div>`).join('')||'<div class="empty">No bookings here.</div>'));
 $('#ex').onclick=()=>csv('bookings',[['Ref','Date','Time','Name','Phone','Service','Note','Status','Amount due','Payment']].concat(BK.map(b=>[b.ref,b.day,b.slot,b.name,b.phone,b.service,b.note,b.status,b.amount_due,b.pay_status])))}

/* ---------- applications + messages ---------- */
function forms(kind){const f=FILT.s||'new',L=FM.filter(x=>x.kind==kind&&(f=='all'||x.status==f)),title=kind=='admission'?'Admission applications':'Messages & enquiries';
 put(`<div class="row"><h2>${title}</h2><button class="btn o sm" id="ex">Download list</button></div><div class="chips">`+[['new','New'],['contacted','Contacted'],['accepted','Accepted'],['closed','Closed'],['all','All']].filter(x=>kind=='admission'||x[0]!='accepted').map(([k,l])=>`<button data-f="${k}" class="${k==f?'on':''}">${l}</button>`).join('')+'</div>'+(L.map(x=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><span class="pill ${x.status=='new'?'new':x.status=='accepted'?'ok':''}">${x.status}</span></div><div class="mut">${ago(x.created)} · ${esc(x.phone)} ${esc(x.email)}</div>${x.message?`<p>${esc(x.message)}</p>`:''}<div class="kv">${Object.entries(x.data||{}).filter(([k,v])=>v).map(([k,v])=>`<span>${esc(k.replace(/_/g,' '))}</span><span>${esc(v)}</span>`).join('')}</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${x.status=='new'?`<button class="btn sm" data-fm="${x.id}" data-st="contacted">Mark contacted</button>`:''}${kind=='admission'&&x.status!='accepted'?`<button class="btn o sm" data-fm="${x.id}" data-st="accepted">Accept</button>`:''}${x.status!='closed'?`<button class="btn o sm" data-fm="${x.id}" data-st="closed">Close</button>`:''}${x.phone?`<a class="btn o sm" target="_blank" rel="noopener" href="${wa(x.phone,'Hello '+x.name+', thank you for contacting '+(SITE.data.name||'')+'.')}">WhatsApp</a><a class="btn o sm" href="tel:${esc(x.phone)}">Call</a>`:''}</div></div>`).join('')||'<div class="empty">Nothing here yet.</div>'));
 $('#ex').onclick=()=>{const L2=FM.filter(x=>x.kind==kind),ks=[...new Set(L2.flatMap(x=>Object.keys(x.data||{})))];csv(kind,[['Date','Name','Phone','Email','Message','Status',...ks]].concat(L2.map(x=>[x.created,x.name,x.phone,x.email,x.message,x.status,...ks.map(k=>(x.data||{})[k])])))}}

/* ---------- settings ---------- */
function settings(){const s={delivery_fee:0,open:'09:00',close:'17:00',slot_minutes:60,capacity:1,days:[1,2,3,4,5,6],orders_open:true,bank:{},...SET},b=s.bank||{},shop=KIND=='restaurant'||KIND=='store';
 put(`<h2>Settings</h2><form class="card" id="sf">${shop?`<label><input type="checkbox" name="orders_open" style="width:auto;margin-right:8px" ${s.orders_open!==false?'checked':''}>Accepting orders (untick to close the shop for now)</label><label>Delivery fee (₦)</label><input name="delivery_fee" type="number" min="0" value="${esc(s.delivery_fee)}"><h3>Bank details for transfers</h3><p class="mut">Shown to customers who choose bank transfer. Leave empty to hide this option.</p><label>Bank</label><input name="bank" value="${esc(b.bank)}"><label>Account name</label><input name="bname" value="${esc(b.name)}"><label>Account number</label><input name="bnum" inputmode="numeric" maxlength="12" value="${esc(b.number)}">`:''}
 ${KIND=='booking'?`<h3>Opening hours</h3><div class="g2"><div><label>Opens</label><input type="time" name="open" value="${s.open}"></div><div><label>Closes</label><input type="time" name="close" value="${s.close}"></div><div><label>Appointment length (minutes)</label><input type="number" name="slot_minutes" min="15" step="5" value="${s.slot_minutes}"></div><div><label>Customers per time slot</label><input type="number" name="capacity" min="1" max="50" value="${s.capacity}"></div></div><h3>Online payment for bookings</h3><p class="mut">Needs Paystack connected below. Customers pay right after booking.</p><div class="g2"><div><label>Take payment</label><select name="book_pay"><option value="off" ${(s.book_pay||'off')=='off'?'selected':''}>No, pay at the shop</option><option value="deposit" ${s.book_pay=='deposit'?'selected':''}>Deposit only</option><option value="full" ${s.book_pay=='full'?'selected':''}>Full price</option></select></div><div><label>Deposit amount (₦)</label><input type="number" name="book_deposit" min="0" value="${esc(s.book_deposit||0)}"></div></div><label>Open days</label><div class="chips" id="dy">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,k)=>`<button type="button" data-d="${k+1}" class="${(s.days||[]).includes(k+1)?'on':''}">${d}</button>`).join('')}</div>`:''}
 ${KIND=='school'?'<p class="mut">Applications and messages appear in their tabs. Add your phone and WhatsApp number in the website editor so parents can reach you.</p>':''}
 <div class="row" style="margin-top:16px"><span class="mut">Website text, photos and colours are changed in the editor.</span><button class="btn">Save settings</button></div></form>${KIND!='school'?`<form class="card" id="pf"><h3>Accept online payments (Paystack)</h3><p class="mut">Customers pay by card or bank transfer and the money goes straight to YOUR Paystack account. Get your keys at paystack.com &gt; Settings &gt; API Keys.</p>${s.paystack_pk?'<div class="pill ok" style="display:inline-block;margin-bottom:8px">Connected</div>':'<div class="pill new" style="display:inline-block;margin-bottom:8px">Not connected</div>'}<label>Public key (pk_...)</label><input name="pk" value="${esc(s.paystack_pk||'')}" autocomplete="off" placeholder="pk_live_..."><label>Secret key (sk_...)</label><input name="sk" type="password" autocomplete="new-password" placeholder="${s.paystack_pk?'Saved. Type a new one to replace it':'sk_live_...'}"><p class="mut">The secret key is stored so only our server can use it to confirm payments. It is never shown again.</p><label>Webhook URL (paste in Paystack &gt; Settings &gt; API Keys &amp; Webhooks)</label><input readonly onclick="this.select()" value="${esc((window.ALPHA_ORIGIN||'https://usealphabiz.com')+'/api/bz-webhook?site='+SITE.id)}"><div class="row" style="margin-top:14px"><button class="btn">${s.paystack_pk?'Update keys':'Connect Paystack'}</button>${s.paystack_pk?'<button type="button" class="btn o" id="pdis">Disconnect</button>':''}</div></form>`:''}<div class="card row"><div><b>Website editor</b><br><span class="mut">Change your text, photos and design.</span></div><a class="btn o sm" href="editor.html?id=${SITE.id}">Open editor</a></div>`);
 const pf=$('#pf');if(pf){pf.onsubmit=async e=>{e.preventDefault();if(!pf.sk.value.trim()&&SET.paystack_pk){toast('Paste the secret key too');return}if(await run(sb.rpc('set_paystack',{sid:SITE.id,p_pk:pf.pk.value,p_sk:pf.sk.value}),'Paystack connected')){SET={...SET,paystack_pk:pf.pk.value.trim()};settings()}};
  const d=$('#pdis');if(d)d.onclick=async()=>{if(!confirm('Stop accepting online payments?'))return;if(await run(sb.rpc('set_paystack',{sid:SITE.id,p_pk:'',p_sk:''}),'Paystack disconnected')){const n={...SET};delete n.paystack_pk;n.book_pay='off';SET=n;await sb.from('b_settings').upsert({site_id:SITE.id,s:n});settings()}}}
 $('#dy')&&($('#dy').onclick=e=>{const b=e.target.closest('[data-d]');if(b)b.classList.toggle('on')});
 $('#sf').onsubmit=async e=>{e.preventDefault();const f=e.target,n={...SET};if(shop){n.orders_open=f.orders_open.checked;n.delivery_fee=Math.max(0,+f.delivery_fee.value||0);n.bank={bank:f.bank.value.trim(),name:f.bname.value.trim(),number:f.bnum.value.trim()}}
  if(KIND=='booking'){n.open=f.open.value||'09:00';n.close=f.close.value||'17:00';n.slot_minutes=Math.max(15,+f.slot_minutes.value||60);n.capacity=Math.max(1,+f.capacity.value||1);n.days=[...document.querySelectorAll('#dy .on')].map(b=>+b.dataset.d);n.book_pay=f.book_pay.value;n.book_deposit=Math.max(0,+f.book_deposit.value||0);if(n.book_pay!='off'&&!n.paystack_pk){toast('Connect Paystack first (below), then turn on online payment');return}if(n.open>=n.close){toast('Closing time must be after opening time');return}}
  if(await run(sb.from('b_settings').upsert({site_id:SITE.id,s:n}),'Settings saved')){SET=n}}}
boot().catch(e=>{if(e)console.error(e)});
})();
</script></body></html>
