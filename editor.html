const isUB=()=>{const t=TPLS.find(x=>x.id===st.variant);return t&&t.ub},nm=x=>x.replace(/⟦name⟧/g,d.name||'').replace(/⟦NAME⟧/g,String(d.name||'').toUpperCase()).replace(/⟦phone⟧/g,d.phone||'');
['tagline','about'].forEach(k=>{const i=$('[data-k='+k+']');i.classList.add('gen');i.previousElementSibling.classList.add('gen')});

function slots(h){const out=[],seen={};let cur='Header and menu',m;const re=/\{\{#sec_(\w+)\}\}|\{\{\/sec_(\w+)\}\}|\{\{([ti])(\d+)\|([\s\S]*?)\}\}/g;while(m=re.exec(h)){if(m[1])cur=m[1];else if(m[2])cur='Footer and other';else{const k=m[3]+m[4];if(seen[k])continue;seen[k]=1;out.push({k,t:m[3],sec:cur,def:m[5]})}}return out}

 [$('#sl').previousElementSibling,$('#sl'),$('#ns').parentElement].forEach(e=>e.style.display=(sv&&sv!='school')?'none':(isUB()?'none':''));
 box.style.display=sv?'block':'none';if(sv)box.innerHTML='<b>⚙️ This is a full business system.</b><br><span class="mut">'+({restaurant:'Your menu, online orders and order tracking',store:'Your products, stock, online orders and tracking',school:'Admission applications and enquiries',booking:'Your services, calendar bookings and enquiries'}[sv])+' are managed in your dashboard, not here. '+(id?'<a href="manage.html?id='+id+'">Open dashboard</a>':'Save your site first, then open <b>Manage</b> from My Websites.')+'</span>'}
async function content(){sysNote();const ub=isUB();$('#sk').value=d.skin||'orig';document.querySelectorAll('.ubo').forEach(e=>e.style.display=ub?'':'none');document.querySelectorAll('.gen').forEach(e=>e.style.display=ub?'none':'');const box=$('#ct');if(!ub){box.innerHTML='';return}
 const L=slots(await loadTpl(st.variant)),by={};d.t=d.t||{};d.i=d.i||{};d.hide=d.hide||[];L.forEach(x=>(by[x.sec]=by[x.sec]||[]).push(x));
 const f=x=>{const v=esc(d.t[x.k]??nm(x.def));return x.t=='t'?(x.def.length>70?`<textarea rows="3" data-t="${x.k}">${v}</textarea>`:`<input data-t="${x.k}" value="${v}">`):`<div class="im"><img src="${esc(d.i[x.k]||x.def)}"><input type="file" accept="image/*" data-im="${x.k}"></div>`};
 box.innerHTML='<p class="mut">Section list. Untick Show to hide a whole section. You can also just tap the text or photo on the page to change it.</p>'+Object.keys(by).map(s=>{const sec=!/^(Header and menu|Footer and other)$/.test(s);return `<details class="ac"><summary><b>${esc(s.replace(/_/g,' '))}</b>${sec?`<label style="float:right;font-weight:400"><input type="checkbox" data-h="${s}" ${d.hide.includes(s)?'':'checked'} style="width:auto;margin:0 4px 0 0">Show</label>`:''}</summary>${by[s].map(f).join('')}</details>`}).join('')}

 if(t.dataset.im&&t.files[0]){d.i[t.dataset.im]=await rs(t.files[0],1000);t.previousElementSibling.src=d.i[t.dataset.im];dirty();draw()}};
