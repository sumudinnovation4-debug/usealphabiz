<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – UseAlphaBiz</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body>
<main class="wrap" style="max-width:1100px"><h1>Admin</h1><div class="card" style="background:var(--gl)"><div class="grid g3" id="st" style="text-align:center"></div></div><br><div class="card" id="ad" style="display:none"></div><br><div class="card" style="overflow-x:auto"><table id="t"></table></div></main>
<script src="engine.js"></script><script src="app.js"></script><script>
let tok;async function load(a,id,x){const r=await fetch(CFG.API+'/admin?action='+a+'&id='+(id||'')+(x||''),{headers:{Authorization:'Bearer '+tok}});if(r.status==403){$('#t').innerHTML='<tr><td>Admin only.</td></tr>';return}
const {sites,pay,owner,admins}=await r.json();$('#ad').style.display=owner?'block':'none';$('#ad').innerHTML=owner?'<h2>Admins</h2><p class="mut">You (alphastacks341@gmail.com) are the owner. Other admins must sign up on the site with the same email, then they can open /admin.</p>'+(admins||[]).map(a=>'<div class="row"><span>'+esc(a.email)+'</span><button class="btn out sm" data-rm="'+esc(a.email)+'">Remove</button></div>').join('')+'<div class="row" style="border:0"><input id="ne" type="email" placeholder="new admin email"><button class="btn sm" id="na">Add admin</button></div>':'';const sum=c=>pay.filter(p=>p.currency==c).reduce((a,p)=>a+ +p.amount,0);
$('#st').innerHTML=[['Sites',sites.length],['Live',sites.filter(s=>s.live).length],['Needs attention',sites.filter(s=>s.status=='failed').length],['Revenue ₦',sum('NGN').toLocaleString()],['Revenue $',sum('USD').toFixed(2)]].map(([k,v])=>'<div><b>'+v+'</b><br><span class="mut">'+k+'</span></div>').join('');
$('#t').innerHTML='<tr><th>Domain</th><th>Business</th><th>Status</th><th>Note</th><th></th></tr>'+sites.map(s=>'<tr><td>'+esc(s.domain)+'</td><td>'+esc(s.name)+'</td><td><span class="pill '+(s.live?'':'draft')+'">'+esc(s.status)+'</span></td><td class="mut">'+esc(s.note)+'</td><td>'+(s.status=='failed'?'<button class="btn sm" data-a="retry" data-i="'+s.id+'">Retry</button> ':'')+(s.live?'<button class="btn out sm" data-a="suspend" data-i="'+s.id+'">Suspend</button> ':s.status=='suspended'?'<button class="btn out sm" data-a="unsuspend" data-i="'+s.id+'">Restore</button> ':'')+'<button class="btn out sm" data-a="delete" data-i="'+s.id+'">Delete</button></td></tr>').join('')}
(async()=>{const sb=SB();if(!sb)return $('#t').innerHTML='<tr><td>Add Supabase keys in app.js.</td></tr>';const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='login.html';tok=session.access_token;load('list')})();
$('#ad').onclick=e=>{const r=e.target.dataset.rm;if(r&&confirm('Remove '+r+' as admin?'))load('rmadmin','','&email='+encodeURIComponent(r));if(e.target.id=='na'){const v=$('#ne').value.trim();if(v)load('addadmin','','&email='+encodeURIComponent(v))}};
$('#t').onclick=e=>{const b=e.target.closest('button');if(!b||(b.dataset.a=='delete'&&!confirm('Delete this site?')))return;load(b.dataset.a,b.dataset.i)};
</script></body></html>
