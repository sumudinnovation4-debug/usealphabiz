<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Templates – UseAlphaBiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.dots{display:flex;gap:7px;margin:8px 0 2px;flex-wrap:wrap}.dots i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}.dots i.on{box-shadow:0 0 0 2px var(--g)}</style></head><body>
<main class="wrap"><h1>Choose Your Template</h1><p class="mut" id="cnt">Pick your business type, then a design and a colour style. You can change both later.</p>
<div class="grid g3" id="cats" style="margin:22px 0"></div>
<section id="vs" style="display:none"><div class="row" style="border:0"><h2 id="vt"></h2><div id="f"></div></div><div class="grid" id="vg" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))"></div></section></main>
<script src="app.js"></script><script src="engine.js"></script><script>
let cur=0,flt='All';
$('#cnt').textContent=TPLS.length+' designs, each in '+SKINS.length+' colour styles. New templates are added regularly.';
$('#cats').innerHTML=CATS.map(([e,n],i)=>`<div class="card tpl" data-i="${i}"><div class="e">${e}</div><b>${n}</b><br><span class="mut" style="font-size:.85rem">${tplsFor(i).length} designs</span></div>`).join('');
$('#cats').onclick=e=>{const c=e.target.closest('.tpl');if(c)show(+c.dataset.i)};
$('#f').innerHTML=['All','Classic','Modern','Bold'].map(t=>`<button class="btn sm ${t=='All'?'':'out'}" data-t="${t}">${t}</button>`).join(' ');
$('#f').onclick=e=>{if(!e.target.dataset.t)return;flt=e.target.dataset.t;[...$('#f').children].forEach(b=>b.classList.toggle('out',b.dataset.t!=flt));draw()};
function show(i){cur=i;$('#vs').style.display='block';$('#vt').textContent=CATS[i][1]+' templates';draw();$('#vs').scrollIntoView({behavior:'smooth'})}
function draw(){const g=$('#vg');g.innerHTML='';const list=tplsFor(cur).map(t=>t.id);
for(const v of list){if(flt!='All'&&tagOf(v)!=flt)continue;const T=TPLS.find(t=>t.id===v),c=document.createElement('div');c.className='card';c.style.padding='10px';let sk='orig';
c.innerHTML=`<div class="pv"><iframe loading="lazy" tabindex="-1"></iframe></div><b>${nameOf(v)}</b> <span class="mut">${tagOf(v)}</span>${T.ub?`<div class="dots">${SKINS.map(s=>`<i data-s="${s.id}" title="${s.name}" style="background:${s.c}" class="${s.id=='orig'?'on':''}"></i>`).join('')}</div>`:''}<small class="mut">Free template by <a href="${T.url}" style="color:var(--g)">${T.by}</a></small><button class="btn sm block" style="margin-top:8px">Use This Template</button>`;
const o={p:1,origin:location.origin},paint=async()=>{if(!o.tpl)o.tpl=await loadTpl(v);o.skin=sk;c.querySelector('iframe').srcdoc=render(defaultData(cur),v,o)};paint();
c.addEventListener('click',e=>{const d=e.target.closest('.dots i');if(!d)return;sk=d.dataset.s;c.querySelectorAll('.dots i').forEach(x=>x.classList.toggle('on',x===d));paint()});
c.querySelector('button').onclick=()=>{const data=defaultData(cur);if(sk!='orig')data.skin=sk;S.set('draft',{cat:cur,variant:v,data});location.href='editor.html'};g.appendChild(c)}fit()}
const fit=()=>document.querySelectorAll('#vg .pv').forEach(p=>{const k=p.clientWidth/1000,f=p.firstChild;if(!k)return;f.style.cssText='width:1000px;height:'+(p.clientHeight/k)+'px;transform:scale('+k+');transform-origin:0 0;border:0;pointer-events:none'});addEventListener('resize',fit);
const k=new URLSearchParams(location.search).get('cat');if(k!==null&&CATS[k])show(+k);
</script></body></html>
